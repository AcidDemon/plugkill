[package]
name = "plugkill-gui"
version = "0.1.0"
edition = "2024"
description = "System tray and settings GUI for plugkill"
license = "GPL-3.0-or-later"
authors = ["AcidDemon"]
repository = "https://github.com/AcidDemon/plugkill"
homepage = "https://github.com/AcidDemon/plugkill"
readme = "../../README.md"
keywords = ["security", "kill-switch", "gtk", "tray", "gui"]
categories = ["gui", "os::unix-apis"]
rust-version = "1.88"

[[bin]]
name = "plugkill-gui"
path = "src/main.rs"

[dependencies]
plugkill-core = { path = "../plugkill-core" }
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# v4_10 for Widget::color(), which tells the dashboard whether the desktop is light.
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
async-channel = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
