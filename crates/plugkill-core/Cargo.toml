[package]
name = "plugkill-core"
version = "0.1.0"
edition = "2024"
description = "Shared types and client library for plugkill"
license = "GPL-3.0"
authors = ["AcidDemon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"

# logind lives on Linux only; the D-Bus paths are cfg'd out elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking"] }

# libusb (rusb) for USB enumeration; libc/nix for sysctl and the SIOCGIFMEDIA ioctl.
[target.'cfg(target_os = "freebsd")'.dependencies]
rusb = "0.9"
libc = "0.2"
nix = { version = "0.29", features = ["net", "ioctl"] }

[dev-dependencies]
tempfile = "3"
