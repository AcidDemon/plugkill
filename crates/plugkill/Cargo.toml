[package]
name = "plugkill"
version = "0.1.0"
edition = "2024"
description = "Hardware kill-switch daemon that shuts down the system on hardware changes (USB, Thunderbolt, SD, PCI, power, network, lid, display)"
license = "GPL-3.0-or-later"
authors = ["AcidDemon"]
repository = "https://github.com/AcidDemon/plugkill"
homepage = "https://github.com/AcidDemon/plugkill"
readme = "../../README.md"
keywords = ["security", "kill-switch", "usb", "daemon", "forensics"]
categories = ["command-line-utilities", "os::unix-apis", "hardware-support"]
rust-version = "1.88"

[[bin]]
name = "plugkill"
path = "src/main.rs"

[dependencies]
plugkill-core = { path = "../plugkill-core" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["signal", "fs", "reboot", "user", "socket"] }
libc = "0.2"
signal-hook = "0.3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
nix = { version = "0.29", features = ["user"] }

[lints]
workspace = true
