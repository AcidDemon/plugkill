name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  freebsd:
    name: FreeBSD build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y rust pkgconf
          run: |
            cargo build --workspace
            # The two --list-devices tests need real sysfs and don't apply here.
            cargo test --workspace -- \
              --skip=test_list_devices_no_root \
              --skip=test_generate_whitelist_no_root
